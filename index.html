<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebUntis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <header class="border-b">
        <div class="max-w-screen-xl mx-auto px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-semibold tracking-tight">WebUntis</span>
                </div>
                
                <div class="flex items-center gap-4">
                    <div id="userInfo" class="hidden text-sm text-gray-600"></div>
                    <button onclick="showSettings()" 
                            class="px-4 py-2 text-sm hover:bg-gray-100 rounded-xl transition-colors">
                        Einstellungen
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-screen-xl mx-auto px-6 py-10">
        
        <!-- Login Screen -->
        <div id="loginScreen">
            <div class="max-w-md mx-auto">
                <div class="text-center mb-10">
                    <h1 class="text-4xl font-semibold tracking-tight">Willkommen bei WebUntis</h1>
                    <p class="text-gray-600 mt-2">Melde dich mit deinen Zugangsdaten an</p>
                </div>

                <div class="bg-white border border-gray-200 rounded-3xl p-8 shadow-sm">
                    <form id="loginForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Schule</label>
                            <input type="text" id="school" placeholder="gymnasium-musterstadt" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-gray-400 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Benutzername</label>
                            <input type="text" id="username" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-gray-400 text-sm" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Passwort</label>
                            <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-gray-400 text-sm" required>
                        </div>
                        
                        <button type="submit" id="loginButton"
                                class="w-full bg-black hover:bg-gray-800 text-white font-medium py-3.5 rounded-2xl transition-all mt-2">
                            Anmelden
                        </button>
                    </form>
                    <div id="loginError" class="hidden mt-4 text-center text-red-600 text-sm"></div>
                </div>
            </div>
        </div>

        <!-- Timetable Screen -->
        <div id="timetableScreen" class="hidden">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-3xl font-semibold">Stundenplan</h1>
                    <p id="weekInfo" class="text-gray-600 mt-1"></p>
                </div>
                
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="showSubstitutions()" 
                            class="px-4 py-2.5 border border-gray-300 hover:bg-gray-50 rounded-2xl text-sm font-medium">
                        Vertretungen
                    </button>
                    <button onclick="showDayView()" 
                            class="px-4 py-2.5 border border-gray-300 hover:bg-gray-50 rounded-2xl text-sm font-medium">
                        Tagesansicht
                    </button>
                    <div class="flex gap-2">
                        <button onclick="changeWeek(-1)" class="px-4 py-2.5 border border-gray-300 hover:bg-gray-50 rounded-2xl text-sm">←</button>
                        <button onclick="changeWeek(1)" class="px-4 py-2.5 border border-gray-300 hover:bg-gray-50 rounded-2xl text-sm">→</button>
                    </div>
                    <button onclick="loadCurrentWeek()" class="px-5 py-2.5 bg-black text-white rounded-2xl text-sm font-medium">Heute</button>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-3xl shadow-sm overflow-hidden">
                <div id="timetableContainer" class="p-6 min-h-[420px]">
                    <!-- Dynamisch gerendert -->
                </div>
            </div>
        </div>

        <!-- Day View -->
        <div id="dayViewScreen" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-3xl font-semibold">Tagesansicht</h1>
                    <p id="dayInfo" class="text-gray-600 mt-1"></p>
                </div>
                <button onclick="showTimetable()" class="px-4 py-2 border border-gray-300 rounded-2xl text-sm">Zurück</button>
            </div>
            <div class="bg-white border border-gray-200 rounded-3xl p-6" id="dayContainer"></div>
        </div>

        <!-- Substitutions -->
        <div id="substitutionScreen" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-semibold">Vertretungen</h1>
                <button onclick="showTimetable()" class="px-4 py-2 border border-gray-300 rounded-2xl text-sm">Zurück</button>
            </div>
            <div id="substitutionContainer" class="bg-white border border-gray-200 rounded-3xl p-6 min-h-[300px]"></div>
        </div>

        <!-- Settings -->
        <div id="settingsScreen" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-3xl font-semibold">Einstellungen</h1>
                <button onclick="showTimetable()" class="px-4 py-2 border border-gray-300 rounded-2xl text-sm">Zurück</button>
            </div>
            <div class="bg-white border border-gray-200 rounded-3xl p-8">
                <div class="space-y-4">
                    <div><span class="text-gray-500">Schule:</span> <span id="settingsSchool" class="font-medium"></span></div>
                    <div><span class="text-gray-500">Benutzer:</span> <span id="settingsUser" class="font-medium"></span></div>
                </div>
                <div class="mt-8">
                    <button onclick="logout()" class="px-6 py-3 bg-red-600 text-white rounded-2xl text-sm font-medium">Abmelden</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</html>
